name: deploy

# Push to main -> test -> build -> push to ECR -> restart the instance.
#
# Authentication is OIDC: GitHub mints a short-lived token and assumes an AWS
# role. There are no AWS access keys in this repository or in its secrets,
# which is the point -- a leaked workflow log cannot hand anyone the account.
#
# Deployment goes through SSM Run Command rather than SSH, so there is no key
# pair to manage and no port 22 open to the internet.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A second push while the first is deploying should supersede it, not race
  # it onto the same instance.
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  REGISTRY: 323708468700.dkr.ecr.us-east-1.amazonaws.com
  IMAGE: silicontruth-app

permissions:
  contents: read
  id-token: write      # required to mint the OIDC token

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Python tests
        # The gates are the product. A deploy that skips them would be
        # shipping the one thing this project claims to be careful about.
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint
        working-directory: web
        run: npx eslint app components lib

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::323708468700:role/silicontruth-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          # Tagged with the commit so a bad deploy can be rolled back to an
          # exact sha rather than "whatever latest was an hour ago".
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Restart the instance on the new image
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
                 --filters Name=tag:Name,Values=silicontruth \
                           Name=instance-state-name,Values=running \
                 --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "no running instance tagged silicontruth"; exit 1
          fi
          CMD=$(aws ssm send-command \
                 --instance-ids "$ID" \
                 --document-name AWS-RunShellScript \
                 --comment "deploy ${{ github.sha }}" \
                 --parameters "commands=[\"/usr/local/bin/silicontruth-deploy ${{ github.sha }}\"]" \
                 --query "Command.CommandId" --output text)
          echo "ssm command $CMD on $ID"
          # Poll rather than `aws ssm wait`, so the failure output is visible
          # in the job log instead of just a non-zero exit.
          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD" \
                       --instance-id "$ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy succeeded"; break;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                  --query "{out:StandardOutputContent,err:StandardErrorContent}" --output text
                echo "deploy $STATUS"; exit 1;;
              *) sleep 10;;
            esac
          done

      - name: Verify the site answers
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances \
                 --filters Name=tag:Name,Values=silicontruth \
                           Name=instance-state-name,Values=running \
                 --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          for _ in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://$IP/" || true)
            [ "$CODE" = "200" ] && { echo "http://$IP/ -> 200"; exit 0; }
            sleep 5
          done
          echo "site did not return 200 after deploy"; exit 1
