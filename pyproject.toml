[project]
name = "silicontruth"
version = "0.1.0"
description = "Verified hardware bring-up: PDF datasheet + errata -> proved CMSIS-SVD, C/Rust HAL, and Renode peripheral"
requires-python = ">=3.11"

# Versions are pinned deliberately. A transitive bump on Nov 3 is a self-inflicted wound.
dependencies = [
    "pydantic==2.9.2",
    "z3-solver==4.13.0.0",
    "pymupdf==1.24.10",
    "opencv-python-headless==4.10.0.84",
    "httpx==0.27.2",
    "cmsis-svd==0.4",
    "svdtools==0.3.18",
    "lxml==5.3.0",
    "typer==0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-timeout==2.3.1",
    "ruff==0.6.9",
]
infra = [
    "modal==0.64.0",
]

[project.scripts]
silicontruth = "silicontruth.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["silicontruth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
