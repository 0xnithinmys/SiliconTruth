[project]
name = "silicontruth"
version = "0.1.0"
description = "Verified hardware bring-up: PDF datasheet + errata -> proved CMSIS-SVD, C/Rust HAL, and Renode peripheral"
requires-python = ">=3.11"

# Versions are pinned deliberately. A transitive bump on Nov 3 is a self-inflicted wound.
# Only what is imported. Five entries were removed after a clean
# `pip install -e .` failed in a container:
#
#   svdtools==0.3.18  -- no such release exists on PyPI (0.1.27 is the
#                        highest), so a fresh install could never succeed.
#                        Named once in a comment, imported nowhere.
#   cmsis-svd         -- never imported; a 35 MB sdist downloaded for nothing
#   opencv-python-headless -- never imported; `doctor` checked for it, which
#                        is the only reason it looked load-bearing
#   lxml, typer       -- never imported
#
# The SVD is emitted as text by svd_emitter.py and the segmenter speaks HTTP
# directly, so none of those libraries were ever on a code path.
dependencies = [
    "pydantic==2.9.2",
    "z3-solver==5.3.2.0",
    "pymupdf==1.24.10",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-timeout==2.3.1",
    "ruff==0.6.9",
]
infra = [
    "modal==0.64.0",
]

[project.scripts]
silicontruth = "silicontruth.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["silicontruth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
